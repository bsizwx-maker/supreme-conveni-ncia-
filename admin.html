<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Admin — SUPREME CONVENIÊNCIA 24HS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>

  :root{
    --black:#0b0b0c;
    --black-2:#161618;
    --white:#fbfbfa;
    --paper:#f4f3ef;
    --red:#e8192c;
    --red-dark:#a4101f;
    --gray:#8a8a8e;
    --line:#e4e2db;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--white);color:var(--black);font-family:'Inter',sans-serif;overflow-x:hidden;}
  body{padding-bottom:70px;}
  h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif; letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;border:none;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--red);color:#fff;}

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:var(--black);color:var(--white);
    padding:10px 14px;
    display:flex;align-items:center;gap:10px;
    border-bottom:3px solid var(--red);
  }
  .logo-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .logo-badge{
    width:44px;height:44px;border-radius:10px;background:var(--black);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
    box-shadow:0 0 0 2px var(--black-2), 0 0 14px rgba(232,25,44,.55);
  }
  .logo-badge svg{width:24px;height:24px;}
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  .brand{min-width:0;}
  .brand .name{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .tag{font-size:9px;letter-spacing:.18em;color:var(--red);font-weight:700;text-transform:uppercase;}
  .head-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;background:var(--black-2);
    display:flex;align-items:center;justify-content:center;color:var(--white);
    position:relative;flex-shrink:0;
  }
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn.wa{background:#25D366;color:#0b0b0c;}
  .cart-count{
    position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
    font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
    font-family:'Inter',sans-serif;
  }

  /* ---------- HERO ---------- */
  .hero{
    background:radial-gradient(120% 160% at 20% -20%, #1c1c1e 0%, var(--black) 55%);
    color:var(--white);padding:26px 16px 22px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:var(--red);opacity:.18;filter:blur(50px);border-radius:50%;
  }
  .hero .open-pill{
    display:inline-flex;align-items:center;gap:6px;background:rgba(232,25,44,.15);
    border:1px solid var(--red);color:#ff5b68;padding:4px 10px;border-radius:99px;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:10px;
  }
  .hero .open-pill .dot{width:6px;height:6px;border-radius:50%;background:#ff5b68;box-shadow:0 0 8px #ff5b68;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hero h1{font-size:38px;line-height:.95;margin:0 0 6px;position:relative;z-index:1;}
  .hero h1 span{color:var(--red);}
  .hero p{margin:0;color:#c7c7cc;font-size:13.5px;max-width:520px;position:relative;z-index:1;}

  /* ---------- CATEGORY NAV ---------- */
  .cat-nav{
    position:sticky;top:63px;z-index:30;background:var(--white);
    border-bottom:1px solid var(--line);
    display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;padding:9px 16px;border-radius:99px;background:var(--paper);
    font-size:13px;font-weight:600;color:var(--black);white-space:nowrap;border:1px solid transparent;
  }
  .cat-chip.active{background:var(--black);color:var(--white);}

  /* ---------- PRODUCTS ---------- */
  .section-title{padding:18px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;}
  .section-title h2{font-size:24px;margin:0;}
  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px 20px;
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  .card .ph{
    aspect-ratio:1/1;background:var(--paper);display:flex;align-items:center;justify-content:center;
    color:#c8c6bd;overflow:hidden;
  }
  .card .ph img{width:100%;height:100%;object-fit:cover;}
  .card .badge-cig{
    position:absolute;top:8px;left:8px;background:var(--black);color:#fff;font-size:9px;
    font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:6px;text-transform:uppercase;
  }
  .card .badge-unavail{
    position:absolute;inset:0;background:rgba(11,11,12,.72);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;text-align:center;padding:10px;
  }
  .card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card .pname{font-size:13.5px;font-weight:600;line-height:1.25;min-height:34px;}
  .card .pdesc{font-size:11px;color:var(--gray);line-height:1.3;}
  .card .row-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .price{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--red);}
  .add-btn{
    width:34px;height:34px;border-radius:10px;background:var(--black);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .add-btn svg{width:16px;height:16px;}
  .add-btn:active{transform:scale(.92);}
  .qty-mini{display:flex;align-items:center;gap:6px;background:var(--black);border-radius:10px;padding:3px;}
  .qty-mini button{width:26px;height:26px;border-radius:7px;background:var(--black-2);color:#fff;font-size:15px;font-weight:700;}
  .qty-mini span{color:#fff;font-size:13px;font-weight:700;min-width:16px;text-align:center;font-family:'JetBrains Mono',monospace;}
  .empty-msg{padding:40px 20px;text-align:center;color:var(--gray);font-size:13px;}

  /* ---------- FLOATING WHATSAPP ---------- */
  .fab-wa{
    position:fixed;right:16px;bottom:20px;z-index:45;
    width:56px;height:56px;border-radius:50%;background:#25D366;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .fab-wa svg{width:28px;height:28px;color:#0b0b0c;}

  /* ---------- FOOTER (spec: bare hours strip only) ---------- */
  footer.hours{
    background:var(--black);color:var(--white);text-align:center;padding:16px 14px 14px;
  }
  footer.hours .h1line{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.06em;}
  footer.hours .h1line span{color:var(--red);}
  footer.hours .h2line{font-size:10px;color:#8a8a8e;letter-spacing:.03em;margin-top:4px;}
  .admin-entry{display:block;text-align:center;padding:8px;font-size:10px;color:#c9c9c9;background:#0b0b0c;}

  /* ---------- MODAL / DRAWER SHARED ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(11,11,12,.55);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex;}
  @media(min-width:720px){.overlay{align-items:center;}}
  .sheet{
    background:var(--white);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
    border-radius:20px 20px 0 0;position:relative;
  }
  @media(min-width:720px){.sheet{border-radius:20px;}}
  .sheet-head{
    position:sticky;top:0;background:var(--white);padding:16px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:2;
  }
  .sheet-head h3{margin:0;font-size:20px;}
  .close-x{width:32px;height:32px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;}
  .close-x svg{width:16px;height:16px;}
  .sheet-body{padding:14px 16px 24px;}

  /* ---------- CART (receipt style, the signature element) ---------- */
  .receipt{
    background:var(--paper); border-radius:10px; padding:16px 14px;
    background-image:repeating-linear-gradient(to bottom, transparent 0 6px, rgba(0,0,0,.05) 6px 7px);
  }
  .receipt-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #cfcdc2;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  .receipt-line:last-child{border-bottom:none;}
  .rl-name{font-weight:600;font-size:12.5px;}
  .rl-meta{color:var(--gray);font-size:10.5px;margin-top:2px;font-family:'Inter',sans-serif;}
  .rl-qty-ctrl{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .rl-qty-ctrl button{width:24px;height:24px;border-radius:6px;background:var(--black);color:#fff;font-weight:700;}
  .rl-remove{color:var(--red);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:6px;display:inline-block;}
  .totals-box{margin-top:14px;border-top:2px dashed #cfcdc2;padding-top:10px;}
  .totals-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;padding:4px 0;}
  .totals-row.total{font-size:17px;font-weight:800;color:var(--black);border-top:1px solid #cfcdc2;margin-top:6px;padding-top:8px;}
  .totals-row.total .v{color:var(--red);}
  .min-warning{
    background:#fff4e0;border:1px solid #f0c987;color:#7a4b00;font-size:12px;padding:9px 11px;
    border-radius:9px;margin-top:12px;font-weight:600;
  }
  .frete-note{font-size:10px;color:var(--gray);font-style:italic;margin-top:8px;}
  .btn-primary{
    width:100%;background:var(--red);color:#fff;padding:15px;border-radius:12px;
    font-weight:800;font-size:14.5px;text-transform:uppercase;letter-spacing:.03em;
    margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:disabled{background:#d8d6cd;color:#9a988f;}
  .btn-primary svg{width:18px;height:18px;}
  .btn-secondary{width:100%;background:var(--black);color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:13.5px;margin-top:10px;}
  .btn-ghost{background:transparent;color:var(--red);font-weight:700;font-size:12.5px;padding:10px;width:100%;text-align:center;}

  /* ---------- FORMS ---------- */
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);margin-bottom:5px;}
  .field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=url],.field input[type=password],.field select,.field textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--white);color:var(--black);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--red);outline-offset:1px;border-color:var(--red);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pay-options{display:flex;gap:8px;flex-wrap:wrap;}
  .pay-opt{flex:1;min-width:90px;padding:12px 8px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-size:12.5px;font-weight:700;}
  .pay-opt.sel{border-color:var(--red);background:#fff0f1;color:var(--red-dark);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .lbl{font-size:13.5px;font-weight:600;}
  .switch{width:44px;height:26px;border-radius:99px;background:#d8d6cd;position:relative;flex-shrink:0;}
  .switch.on{background:var(--red);}
  .switch .knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
  .switch.on .knob{left:21px;}
  .photo-drop{
    border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--gray);font-size:12px;position:relative;
  }
  .photo-drop img{max-height:120px;margin:0 auto 8px;border-radius:8px;}
  .photo-drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  /* ---------- ADMIN ---------- */
  #admin-root{display:none;min-height:100vh;background:var(--paper);}
  #admin-root.show{display:block;}
  #store-root.hide{display:none;}
  .adm-topbar{background:var(--black);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .adm-topbar .t{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;}
  .adm-topbar .t span{color:var(--red);}
  .adm-exit{font-size:11px;font-weight:700;color:#c9c9c9;background:var(--black-2);padding:8px 12px;border-radius:8px;}
  .adm-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:19;}
  .adm-tab{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--paper);white-space:nowrap;}
  .adm-tab.active{background:var(--black);color:#fff;}
  .adm-body{padding:16px;}
  .adm-add-btn{background:var(--red);color:#fff;font-weight:800;padding:13px;border-radius:11px;width:100%;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .adm-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;margin-bottom:10px;align-items:center;}
  .adm-item .th{width:50px;height:50px;border-radius:8px;background:var(--paper);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#c8c6bd;}
  .adm-item .th img{width:100%;height:100%;object-fit:cover;}
  .adm-item .info{flex:1;min-width:0;}
  .adm-item .info .n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .adm-item .info .m{font-size:11px;color:var(--gray);margin-top:2px;}
  .adm-item .acts{display:flex;gap:6px;flex-shrink:0;}
  .adm-item .acts button{width:32px;height:32px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;}
  .adm-item .acts button svg{width:15px;height:15px;}
  .adm-item .acts button.del{color:var(--red);}
  .pill-status{font-size:9.5px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:99px;letter-spacing:.03em;}
  .pill-on{background:#e6f6ea;color:#1a7a37;}
  .pill-off{background:#f4e6e6;color:#a11d1d;}
  .adm-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);padding:20px;}
  .adm-login-box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;}
  .adm-login-box .logo-badge{margin:0 auto 14px;}
  .adm-login-box h2{margin:0 0 4px;font-size:24px;}
  .adm-login-box p{font-size:12px;color:var(--gray);margin:0 0 18px;}
  .pin-input{width:100%;padding:16px;text-align:center;font-size:24px;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:12px;font-family:'JetBrains Mono',monospace;}
  .adm-err{color:var(--red);font-size:12px;font-weight:700;margin-top:8px;min-height:16px;}
  .settings-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .settings-card h4{margin:0 0 12px;font-size:14px;}
  .save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;}
  .order-log{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12px;}
  .order-log .oh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .drag-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 0;}
  .variant-row{display:flex;gap:8px;align-items:center;margin-bottom:9px;background:var(--paper);border-radius:10px;padding:9px;}
  .variant-row input[type=text]{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;}
  .variant-row input[type=number]{width:78px;padding:9px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;}
  .variant-row .v-rm{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .variant-row .v-rm svg{width:14px;height:14px;}
  .variant-avail{width:30px;height:30px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .variant-avail svg{width:15px;height:15px;}
  .from-price{font-size:9.5px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:-2px;}
  .card-cart-badge{position:absolute;top:8px;right:8px;background:var(--black);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:'JetBrains Mono',monospace;z-index:2;}
  .choose-btn{background:var(--black);color:#fff;font-size:11px;font-weight:700;padding:8px 10px;border-radius:9px;white-space:nowrap;}
  .vs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .vs-row:last-child{border-bottom:none;}
  .vs-row .vn{font-size:13.5px;font-weight:600;}
  .vs-row .vp{font-family:'JetBrains Mono',monospace;color:var(--red);font-weight:700;font-size:13px;margin-top:2px;}
  .vs-row .vq{display:flex;align-items:center;gap:8px;}
  .vs-row .vq button{width:28px;height:28px;border-radius:8px;background:var(--black);color:#fff;font-weight:700;}
  .vs-row .vq span{min-width:16px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;}
  .vs-unavail{opacity:.45;pointer-events:none;}

</style>
</head>
<body>

<div id="admin-root" class="show">
  <div class="adm-login" id="adm-login-screen">
    <div class="adm-login-box">
      <div class="logo-badge" style="width:64px;height:64px;margin:0 auto 14px;"><img id="login-logo-img" alt="Supreme Conveniência"></div>
      <h2>Painel Admin</h2>
      <p>Entre com seu e-mail e senha</p>
      <div class="field" style="text-align:left;"><label>E-mail</label><input type="text" id="login-email" placeholder="seuemail@exemplo.com"></div>
      <div class="field" style="text-align:left;"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
      <div class="adm-err" id="login-err"></div>
      <button class="btn-secondary" id="login-enter" style="margin-top:6px;">Entrar</button>
      <button class="btn-ghost" id="login-back">Voltar para a loja</button>
    </div>
  </div>

  <div id="adm-main" style="display:none;">
    <div class="adm-topbar">
      <div class="t">SUPREME <span>ADMIN</span></div>
      <button class="adm-exit" id="adm-exit-btn">Sair</button>
    </div>
    <div class="adm-tabs">

<div class="overlay" id="product-form-overlay">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sheet-head"><h3 id="pf-title">Adicionar produto</h3><button class="close-x" id="close-pf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="sheet-body">
      <div class="field"><label>Foto do produto</label>
        <div class="photo-drop" id="photo-drop">
          <img id="photo-preview" style="display:none">
          <div id="photo-drop-label">Toque para escolher uma foto</div>
          <input type="file" accept="image/*" id="pf-file">
        </div>
      </div>
      <div class="field"><label>Nome do produto</label><input type="text" id="pf-nome" placeholder="Ex: Cerveja Skol Lata 350ml"></div>
      <div class="field"><label>Categoria</label><select id="pf-categoria"></select></div>
      <div class="toggle-row"><div class="lbl">Tem variações (sabores, tamanhos...)?</div><div class="switch" id="pf-hasvar"><div class="knob"></div></div></div>
      <div class="field" id="pf-price-wrap">
        <label>Preço (R$)</label><input type="number" id="pf-preco" step="0.01" min="0" placeholder="0,00">
      </div>
      <div id="pf-variants-wrap" style="display:none;">
        <label style="display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);margin-bottom:8px;">Opções do produto (ex: sabores, tamanhos)</label>
        <div id="pf-variant-list"></div>
        <button class="btn-ghost" id="pf-add-variant" style="border:1.5px dashed var(--line);border-radius:10px;color:var(--black);font-weight:700;margin-top:2px;">+ Adicionar opção</button>
      </div>
      <div class="field"><label>Descrição (opcional)</label><textarea id="pf-desc" placeholder="Detalhes do produto"></textarea></div>
      <div class="toggle-row"><div class="lbl">Produto disponível</div><div class="switch on" id="pf-disp"><div class="knob"></div></div></div>
      <div class="toggle-row"><div class="lbl">É cigarro?</div><div class="switch" id="pf-cig"><div class="knob"></div></div></div>
      <div class="toggle-row"><div class="lbl">Produto ativo (visível na loja)</div><div class="switch on" id="pf-ativo"><div class="knob"></div></div></div>
      <div class="adm-err" id="pf-err"></div>
      <button class="btn-primary" id="pf-save" style="background:var(--black);">Salvar produto</button>
    </div>
  </div>
</div>

var DEFAULT_SETTINGS = {
  freteNormal: 10, freteCigarro: 15, pedidoMinimo: 20,
  horarioEspecial: "03:00",
  observacao: "Após as 3h, consulte os valores do frete, pois podem sofrer alterações."
};

var state = {
  categories: [], products: [], settings: DEFAULT_SETTINGS,
  adminTab: "produtos", editingProductId: null, editingCategoryId: null,
  pendingPhotoFile: null, pendingPhotoPreview: null, pendingVariants: []
};

/* ===================== UTIL ===================== */
function money(v){ return "R$ " + (Math.round(v*100)/100).toFixed(2).replace(".", ","); }
function showToast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function openOverlay(id){ document.getElementById(id).classList.add("show"); }
function closeOverlay(id){ document.getElementById(id).classList.remove("show"); }
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function hasVariants(p){ return p && p.variants && p.variants.length > 0; }

/* ===================== AUTH ===================== */
function wireAuth(){
  document.getElementById("login-back").addEventListener("click", function(){ window.location.href = "index.html"; });
  document.getElementById("adm-exit-btn").addEventListener("click", function(){ auth.signOut(); });
  document.getElementById("login-enter").addEventListener("click", doLogin);
  document.getElementById("login-senha").addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  function doLogin(){
    var email = document.getElementById("login-email").value.trim();
    var senha = document.getElementById("login-senha").value;
    var err = document.getElementById("login-err");
    err.textContent = "";
    if(!email || !senha){ err.textContent = "Preencha e-mail e senha."; return; }
    auth.signInWithEmailAndPassword(email, senha).catch(function(e){
      err.textContent = "E-mail ou senha incorretos.";
      console.error(e);
    });
  }

  auth.onAuthStateChanged(function(user){
    if(user){
      document.getElementById("adm-login-screen").style.display = "none";
      document.getElementById("adm-main").style.display = "block";
      startListeners();
      state.adminTab = "produtos";
      renderAdminBody();
    } else {
      document.getElementById("adm-login-screen").style.display = "flex";
      document.getElementById("adm-main").style.display = "none";
      stopListeners();
    }
  });

  document.querySelectorAll(".adm-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".adm-tab").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      state.adminTab = tab.getAttribute("data-tab");
      renderAdminBody();
    });
  });
}

/* ===================== FIRESTORE LISTENERS ===================== */
var unsubCategories = null, unsubProducts = null, unsubSettings = null;
function startListeners(){
  unsubCategories = db.collection("categories").onSnapshot(function(snap){
    state.categories = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(state.adminTab === "categorias") renderAdminBody();
    if(document.getElementById("product-form-overlay").classList.contains("show")){
      var sel = document.getElementById("pf-categoria");
      var cur = sel.value;
      sel.innerHTML = activeCategoriesForSelect();
      if(cur) sel.value = cur;
    }
  }, function(err){ console.error(err); showToast("Erro ao carregar categorias."); });

  unsubProducts = db.collection("products").onSnapshot(function(snap){
    state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(state.adminTab === "produtos") renderAdminBody();
  }, function(err){ console.error(err); showToast("Erro ao carregar produtos."); });

  unsubSettings = db.collection("settings").doc("config").onSnapshot(function(doc){
    state.settings = doc.exists ? doc.data() : DEFAULT_SETTINGS;
    if(!doc.exists){ db.collection("settings").doc("config").set(DEFAULT_SETTINGS); }
    if(state.adminTab === "config") renderAdminBody();
  }, function(err){ console.error(err); });
}
function stopListeners(){
  if(unsubCategories) unsubCategories(); if(unsubProducts) unsubProducts(); if(unsubSettings) unsubSettings();
}

/* ===================== ADMIN RENDER ===================== */
function renderAdminBody(){
  var body = document.getElementById("adm-body");
  if(state.adminTab === "produtos") return renderAdminProdutos(body);
  if(state.adminTab === "categorias") return renderAdminCategorias(body);
  if(state.adminTab === "pedidos") return renderAdminPedidos(body);
  if(state.adminTab === "config") return renderAdminConfig(body);
}

function renderAdminProdutos(body){
  body.innerHTML = '<button class="adm-add-btn" id="add-produto-btn">+ ADICIONAR PRODUTO</button><div id="adm-prod-list"></div>';
  document.getElementById("add-produto-btn").addEventListener("click", function(){ openProductForm(null); });
  var list = document.getElementById("adm-prod-list");
  if(state.products.length === 0){ list.innerHTML = '<div class="empty-msg">Nenhum produto cadastrado ainda.</div>'; return; }
  list.innerHTML = state.products.map(function(p){
    var cat = state.categories.find(function(c){ return c.id === p.categoryId; });
    var th = p.photoURL ? '<img src="'+p.photoURL+'">' : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
    return '<div class="adm-item">' +
      '<div class="th">'+th+'</div>' +
      '<div class="info">' +
        '<div class="n">'+escapeHtml(p.name)+(p.isCigarette?' 🚬':'')+'</div>' +
        '<div class="m">'+ (hasVariants(p) ? (p.variants.length+' opção(ões)') : money(p.price)) +' · '+ (cat?escapeHtml(cat.name):"Sem categoria") + '</div>' +
